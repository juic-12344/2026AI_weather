import requests

# 1. 設定氣象署的 API 網址（這裡以一般天氣預報資料集為例）
url = 'https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001'

# 2. 設定參數，帶入你的 API Key
params = {
    'Authorization': 'CWA-B7027CBB-4D9D-415E-A5A3-737F76555BAA'
}

# 3. 發送請求向氣象署索取資料
response = requests.get(url, params=params)

# 4. 把回傳的資料轉成 JSON 格式（一種像樹狀結構、電腦很好讀懂的格式）
data = response.json()

# 5. 印出來看看是否成功
print(data)